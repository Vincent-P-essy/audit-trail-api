name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  tamper-detection:
    # The claim this project makes is "tampering is detected". CI proves it on
    # every push rather than asking anyone to take the README's word for it.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: A clean trail verifies
        run: |
          attest --db ci.db --key ci-key.pem init
          for i in 1 2 3 4 5; do
            attest --db ci.db --key ci-key.pem append \
              --actor "u$i" --action payment.approve --resource "PAY-$i" \
              --payload "{\"amount_cents\": $((1000 * i))}"
          done
          attest --db ci.db --key ci-key.pem checkpoint
          attest --db ci.db --key ci-key.pem verify

      - name: An edited entry is detected
        run: |
          python - <<'PY'
          from attest.core.store import Store
          Store("ci.db").force_mutate(2, actor="attacker")
          PY
          # verify exits 2 on a broken trail; anything else is a failure of the
          # thing this repository exists to do.
          if attest --db ci.db --key ci-key.pem verify; then
            echo "::error::tampering was NOT detected"
            exit 1
          fi
          echo "tampering detected as expected"

      - name: A truncated trail is detected via the checkpoint
        run: |
          rm -f trunc.db
          attest --db trunc.db --key ci-key.pem init --force
          for i in 1 2 3 4; do
            attest --db trunc.db --key ci-key.pem append \
              --actor u --action a --resource "r$i"
          done
          attest --db trunc.db --key ci-key.pem checkpoint
          python - <<'PY'
          from attest.core.store import Store
          s = Store("trunc.db")
          s.force_delete(4)
          s.force_delete(3)
          PY
          if attest --db trunc.db --key ci-key.pem verify; then
            echo "::error::truncation was NOT detected"
            exit 1
          fi
          echo "truncation detected as expected"

      - name: The evidence pack renders
        run: |
          attest --db ci.db --key ci-key.pem export --out pack.pdf
          test -s pack.pdf
          head -c 4 pack.pdf | grep -q '%PDF'
